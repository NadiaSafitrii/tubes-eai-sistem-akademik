events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8000;
        server_name localhost;

        # SIAKAD API Gateway Routing
        location /siakad/ {
            proxy_pass http://siakad:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Finance API Gateway Routing
        location /finance/ {
            proxy_pass http://finance:8002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Library API Gateway Routing
        location /library/ {
            proxy_pass http://library:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Attendance API Gateway Routing
        location /attendance/ {
            proxy_pass http://attendance:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root gateway healthcheck / landing message
        location / {
            return 200 "{\"gateway\": \"Nginx API Gateway\", \"status\": \"Running\", \"routes\": [\"/siakad/\", \"/finance/\", \"/library/\", \"/attendance/\"]}";
            add_header Content-Type application/json;
        }
    }
}
